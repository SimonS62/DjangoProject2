name: Django CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      env:
        # Укажите здесь параметры, чтобы Django не ругался на отсутствие данных
        SECRET_KEY: 'django-insecure-)75ie+f9$36qfey@5$8hpp-so9icp)#@1nxo7+wo3g3t(o2k7i'
        DJANGO_SETTINGS_MODULE: 'myproject.settings'
      run: |
        python manage.py test

