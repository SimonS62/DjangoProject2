name: CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Автоматически запускается при пуше в ветку develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.11", "3.10"]  # Тестируем на разных версиях Python

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django tests
      run: |
        python manage.py test

  deploy:
    needs: test  # Запускается только после успешного завершения тестов
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          # Переходим в папку проекта
          cd /var/www/DjangoProject2

          # Обновляем код из ветки develop
          git pull origin develop

          # Активируем виртуальное окружение
          source venv/bin/activate

          # Обновляем зависимости
          pip install -r requirements.txt

          # Применяем миграции
          python manage.py migrate

          # Собираем статику
          python manage.py collectstatic --noinput

          # Перезапускаем Gunicorn
          sudo systemctl restart gunicorn
